<div id="chunk-optimized-{{ chunk.pk }}" class="bg-green-50 p-3 rounded-md border border-green-200 shadow-sm relative group/chunk">
    <div class="flex justify-between items-center mb-2 border-b border-green-200 pb-1">
        <h6 class="font-bold text-green-800 flex items-center">
            <svg class="w-4 h-4 mr-1 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            After (Optimized)
        </h6>
        <div class="flex items-center space-x-2 flex-nowrap">
            {% if chunk.audio_recording and chunk.audio_recording.audio_file %}
            {% if not hide_play_btn %}
            <button type="button" class="chunk-audio-play-btn whitespace-nowrap text-xs font-bold text-blue-700 bg-blue-100 hover:bg-blue-200 px-2 py-1 rounded transition focus:outline-none focus:ring-2 focus:ring-blue-400 flex items-center shadow-sm border border-blue-200" data-audio-url="{{ chunk.audio_recording.audio_file.url }}" data-audio-speed="{{ request.user.audio_speed_pref }}">
                <svg class="w-3 h-3 mr-1 play-icon" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                <svg class="w-3 h-3 mr-1 hidden stop-playback-icon" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4h12v12H4z"></path></svg>
                <span class="btn-text">Play</span>
            </button>
            {% endif %}
            <button type="button" 
                class="group/btn whitespace-nowrap text-xs font-bold text-red-700 bg-red-100 hover:bg-red-200 px-2 py-1 rounded transition focus:outline-none focus:ring-2 focus:ring-red-400 flex items-center shadow-sm border border-red-200"
                hx-post="{% url 'documents:chunk-record' chunk.pk %}"
                hx-target="#chunk-optimized-{{ chunk.pk }}"
                hx-swap="outerHTML"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                title="Regenerate Audio">
                <svg class="w-3 h-3 group-[.htmx-request]/btn:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span class="hidden md:inline group-[.htmx-request]/btn:hidden ml-1">Regenerate Audio</span>
                <span class="hidden group-[.htmx-request]/btn:inline text-[10px] uppercase tracking-wider animate-pulse opacity-80">Regenerating...</span>
            </button>
            {% else %}
            <button type="button" 
                class="group/btn whitespace-nowrap text-xs font-bold text-red-700 bg-red-100 hover:bg-red-200 px-2 py-1 rounded transition focus:outline-none focus:ring-2 focus:ring-red-400 flex items-center shadow-sm border border-red-200"
                hx-post="{% url 'documents:chunk-record' chunk.pk %}"
                hx-target="#chunk-optimized-{{ chunk.pk }}"
                hx-swap="outerHTML"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                <svg class="w-3 h-3 mr-1 group-[.htmx-request]/btn:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                <span class="btn-text group-[.htmx-request]/btn:hidden">Record</span>
                <span class="hidden group-[.htmx-request]/btn:inline text-[10px] uppercase tracking-wider animate-pulse opacity-80">Recording...</span>
            </button>
            {% endif %}

            {% if has_edit_feature %}
            <button type="button" hx-get="{% url 'documents:chunk-edit' chunk.pk %}" hx-target="#chunk-optimized-{{ chunk.pk }}" hx-swap="outerHTML" class="whitespace-nowrap text-xs font-bold text-green-700 bg-green-100 hover:bg-green-200 px-2 py-1 rounded transition focus:outline-none focus:ring-2 focus:ring-green-400 flex items-center shadow-sm border border-green-200">
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                Edit
            </button>
            {% else %}
            <a href="{% url 'pricing:pricing' %}" title="Upgrade to Premium to edit" class="whitespace-nowrap text-xs font-bold text-gray-500 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded transition flex items-center shadow-sm border border-gray-200">
                <svg class="w-3 h-3 mr-1 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
                Edit
            </a>
            {% endif %}
        </div>
    </div>
    <p class="text-green-700 font-mono text-xs whitespace-pre-wrap leading-relaxed">{{ chunk.highlighted_optimized_text }}</p>
</div>
