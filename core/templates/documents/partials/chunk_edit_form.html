<div id="chunk-optimized-{{ chunk.pk }}" class="bg-green-50 p-3 rounded-md border border-brand shadow-md relative">
    <div class="flex justify-between items-center mb-2 border-b border-green-200 pb-1">
        <h6 class="font-bold text-brand flex items-center">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            Editing Optimized Text
        </h6>
    </div>
    <form hx-post="{% url 'documents:chunk-edit' chunk.pk %}" hx-target="#chunk-optimized-{{ chunk.pk }}" hx-swap="outerHTML">
        {% csrf_token %}
        <textarea name="optimized_text" rows="8" class="w-full text-gray-800 font-mono text-xs p-2 border border-brand/50 rounded focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand bg-white resize-y">{{ chunk.optimized_text }}</textarea>
        <div class="flex justify-end gap-2 mt-2">
            <!-- For cancellation, we just GET the chunk display endpoint which ignores POST data and returns the display form -->
            <button type="button" hx-get="{% url 'documents:chunk-edit' chunk.pk %}" hx-target="#chunk-optimized-{{ chunk.pk }}" hx-swap="outerHTML" class="px-3 py-1 text-xs font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded transition focus:outline-none focus:ring-2 focus:ring-gray-400">Cancel</button>
            <button type="submit" class="px-3 py-1 text-xs font-bold text-white bg-brand hover:bg-brandHover rounded transition shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-brand flex items-center">
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Save Changes
            </button>
        </div>
    </form>
</div>
