volumes:
  local_postgres_data: {}
  local_postgres_data_backups: {}
  local_redis_data: {}

services:
  django:
    container_name: local_django_app
    build:
      context: .
      dockerfile: ./Dockerfile.local
    image: optreeda_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  postgres:
    container_name: local_pg_db
    image: postgres:15-alpine
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    ports:
      - "5432:5432"

  redis:
    container_name: local_redis_db
    image: redis:8.0.1
    volumes:
      - local_redis_data:/data
    ports:
      - "6379:6379"

  celeryworker:
    container_name: local_celery_worker
    build:
      context: .
      dockerfile: ./Dockerfile.local
    image: optreeda_local_celeryworker
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    command: /start-celeryworker
