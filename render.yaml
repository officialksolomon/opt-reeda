databases:
  - name: optreeda-db
    databaseName: optreeda
    user: optreeda
    plan: free

services:
  # Inactive: Uncomment to provision a Redis instance on Render when ready
  # - type: redis
  #   name: optreeda-redis
  #   plan: free
  #   ipAllowList: []

  - type: web
    name: optreeda-web
    env: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    dockerCommand: /start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: optreeda-db
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: optreeda-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: optreeda-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: optreeda-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: optreeda-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: optreeda-db
          property: password
      # Inactive: Uncomment if optreeda-redis service above is enabled
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: optreeda-redis
      #     property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_ADMIN_URL
        value: "admin/"
      - key: DJANGO_ACCOUNT_EMAIL_VERIFICATION
        value: "none"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EL_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_USE_SSL
        sync: false


